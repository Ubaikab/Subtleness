<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Books by Ubaikab...</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            font-family: 'Poppins', sans-serif;
            color: white;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 20px;
            border: 5px solid white;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        .loading-text {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4d6d, #ff7f7f);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            color: white;
        }

        .subtext {
            font-size: 1em;
            margin-top: 10px;
            color: white;
            opacity: 0.8;
        }

        .progress-bar {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            overflow: hidden;
            margin: 20px auto;
            position: relative;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #ff4d6d;
            border-radius: 50px;
            animation: load 3s ease-in-out forwards;
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .heart {
            width: 80px;
            height: 80px;
            margin-top: 20px;
            animation: heartbeat 1.5s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .next-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff7f7f);
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.3);
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .next-btn:hover {
            background: linear-gradient(135deg, #ff7f7f, #ff4d6d);
            transform: scale(1.1);
        }

        /* Falling emojis */
        .emoji {
            position: absolute;
            font-size: 2em;
            top: -50px;
            animation: fall linear infinite, fadeInEmoji 1s ease-in-out;
        }

        @keyframes fall {
            from { transform: translateY(-50px); }
            to { transform: translateY(100vh); }
        }

        @keyframes fadeInEmoji {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-text">Loading Book...</div>
        <div class="subtext">Get ready for the cutest moment! 💖</div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <img class="heart" src="https://static.vecteezy.com/system/resources/thumbnails/017/419/333/small/3d-illustration-of-a-shiny-heart-symbol-of-love-and-romance-png.png" alt="Heart">
        <button class="next-btn" onclick="window.location.href='book.html'">NEXT →</button>
    </div>

    <script>
        function createEmoji() {
            const emojiArray = ['❤️', '💖', '💘', '💕', '💞', '💓', '💗', '😍'];
            const emoji = document.createElement('div');
            emoji.classList.add('emoji');
            emoji.innerText = emojiArray[Math.floor(Math.random() * emojiArray.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 3 + 2) + 's';

            document.body.appendChild(emoji);

            setTimeout(() => emoji.remove(), 5000);
        }

        setInterval(createEmoji, 500);
    </script>
</body>
</html>
